name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Гирифтани repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Пайдо кардан ва кушодани ZIP
      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d project

          echo "Searching Android project..."

          PROJECT_DIR=$(find project -type f -name "settings.gradle" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find project -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            find project -maxdepth 5 -type f
            exit 1
          fi

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 3. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # 5. Санҷиши файлҳои Android
      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "Checking project..."

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/AndroidManifest.xml" || \
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Android project is OK."

      # 6. Build APK
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # 7. Пайдо кардани APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jurnali-Man-V3-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
